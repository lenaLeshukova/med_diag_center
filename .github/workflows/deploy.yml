name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/env-and-models

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-size: '3.12'

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --user poetry
          python -m poetry config virtualenvs.create true
          python -m poetry install --no-root

      - name: Run Code Linters (Flake8)
        run: |
          python -m poetry run flake8 . --exclude=.venv,migrations,config/settings.py --max-line-length=120

      - name: Run Unit Tests
        run: |
          python -m poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # Если ключ без пароля, GitHub просто проигнорирует это поле
          script: |
            # 1. Проверяем и устанавливаем docker / docker-compose, если их нет
            if ! command -v docker &> /dev/null; then
              sudo apt update && sudo apt install -y docker.io docker-compose
            fi
            
            # 2. Жёстко останавливаем ВСЕ запущенные ранее докер-контейнеры (от прошлого проекта)
            echo "Очистка старых контейнеров..."
            sudo docker stop $(sudo docker ps -aq) 2>/dev/null || true
            sudo docker rm $(sudo docker ps -aq) 2>/dev/null || true
            
            # 3. Полностью удаляем старые неиспользуемые докер-образы и сети, чтобы освободить место
            sudo docker system prune -af --volumes
            
            # 4. Переходим в папку с проектом или клонируем его с нуля
            PROJECT_DIR="med_diag_center"
            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
              sudo git fetch --all
              sudo git reset --hard origin/main || sudo git reset --hard origin/master
              sudo git pull origin main || sudo git pull origin master
            else
              sudo git clone https://github.com{{ github.repository }}.git "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            fi
            
            # 5. Записываем свежий секретный файл .env на сервер из секретов GitHub
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # 6. Запускаем сборку нового проекта с нуля в фоновом режиме
            echo "Запуск нового медицинского центра в Docker..."
            sudo docker-compose up --build -d
