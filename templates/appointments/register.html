{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Регистрация — MedDiagCenter{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 border rounded p-4 bg-white shadow-sm">
        <h2 class="text-center mb-4 text-primary fw-bold"><i class="bi bi-person-plus me-2"></i>Регистрация пациента</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-success w-100 mt-3">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-3 small">
            Уже есть аккаунт? <a href="{% url 'appointments:login' %}">Войти в кабинет</a>
        </div>
    </div>
</div>
{% endblock %}
