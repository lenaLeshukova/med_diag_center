{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Вход — MedDiagCenter{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 border rounded p-4 bg-white shadow-sm">
        <h2 class="text-center mb-4 text-primary fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i>Вход в кабинет</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
        </form>
        <div class="text-center mt-3 small">
            Еще не зарегистрированы? <a href="{% url 'appointments:register' %}">Создать аккаунт</a>
        </div>
    </div>
</div>
{% endblock %}
