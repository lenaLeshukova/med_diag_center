version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=med_diag_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securedockerpassword2026
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-prod-key-for-yandex-cloud-2026
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,db
      - DB_HOST=db
      - DB_NAME=med_diag_db
      - DB_USER=postgres
      - DB_PASSWORD=securedockerpassword2026
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
